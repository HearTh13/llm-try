version: "3.8"

services:
  # 1. Database PostgreSQL
  db:
    # Diganti dari postgres:15-alpine ke pgvector (superset Postgres + extension vector)
    # untuk mendukung RAG di Modul 4. Tetap kompatibel penuh dengan Modul 1-3.
    image: pgvector/pgvector:pg15
    container_name: postgres_db_main
    platform: linux/amd64
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: llm_chat_db
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 2. Modul 1 (CRUD & Database)
  modul1_api:
    build: ./modul1
    container_name: fastapi_modul1
    platform: linux/amd64
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:root@db:5432/llm_chat_db
    depends_on:
      - db

  # 3. Modul 2 (LLM / Gemini)
  modul2_llm:
    build: ./modul2
    container_name: fastapi_modul2
    platform: linux/amd64
    restart: always
    ports:
      - "8001:8001"
    environment:
      LLM_PROVIDER: "gemini"
      LLM_MODEL: "gemini-2.5-flash"
      GEMINI_API_KEY: "${GEMINI_API_KEY}"
      OPENAI_API_KEY: "GANTI_DENGAN_API_KEY_OPENAI_KAMU_DISINI"
    depends_on:
      - db

  # 4. Modul 3 (AI Assistant)
  modul3_assistant:
    build: ./modul3
    container_name: fastapi_modul3
    platform: linux/amd64
    restart: always
    ports:
      - "8002:8002"
    environment:
      DATABASE_URL: postgresql://postgres:root@db:5432/llm_chat_db
      LLM_PROVIDER: "gemini"
      LLM_MODEL: "gemini-2.5-flash"
      GEMINI_API_KEY: "${GEMINI_API_KEY}"
    depends_on:
      - db

  # 5. Modul 4 (AI Assistant + RAG - dalam pengembangan)
  modul4_rag:
    build: ./modul4
    container_name: fastapi_modul4
    platform: linux/amd64
    restart: always
    ports:
      - "8003:8003"
    environment:
      DATABASE_URL: postgresql://postgres:root@db:5432/llm_chat_db
      # --- Pilih provider: "gemini" (default) atau "ollama" ---
      LLM_PROVIDER: "${LLM_PROVIDER:-gemini}"
      EMBEDDING_PROVIDER: "${EMBEDDING_PROVIDER:-gemini}"
      LLM_MODEL: "${LLM_MODEL:-gemini-2.5-flash}"
      EMBEDDING_MODEL: "${EMBEDDING_MODEL:-gemini-embedding-001}"
      EMBEDDING_DIM: "${EMBEDDING_DIM:-768}"
      GEMINI_API_KEY: "${GEMINI_API_KEY}"
      # Ollama di host (lihat extra_hosts di bawah)
      OLLAMA_BASE_URL: "${OLLAMA_BASE_URL:-http://host.docker.internal:11434}"
    extra_hosts:
      # Agar container bisa mengakses Ollama yang berjalan di laptop (host)
      - "host.docker.internal:host-gateway"
    volumes:
      # Bind-mount folder knowledge base agar dokumen yang di-upload lewat API
      # tersimpan di host dan tidak hilang saat container di-rebuild.
      - ./modul4/app/data/knowledge_base:/code/app/data/knowledge_base
    depends_on:
      - db

volumes:
  postgres_data:
