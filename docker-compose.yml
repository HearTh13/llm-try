version: "3.8"

services:
  # 1. Database PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: postgres_db_main
    platform: linux/amd64
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: llm_chat_db
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 2. Modul 1 (CRUD & Database)
  modul1_api:
    build: ./modul1
    container_name: fastapi_modul1
    platform: linux/amd64
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:root@db:5432/llm_chat_db
    depends_on:
      - db

  # 3. Modul 2 (LLM / Gemini)
  modul2_llm:
    build: ./modul2
    container_name: fastapi_modul2
    platform: linux/amd64
    restart: always
    ports:
      - "8001:8001"
    environment:
      LLM_PROVIDER: "gemini"
      LLM_MODEL: "gemini-2.5-flash"
      GEMINI_API_KEY: "${GEMINI_API_KEY}"
      OPENAI_API_KEY: "GANTI_DENGAN_API_KEY_OPENAI_KAMU_DISINI"
    depends_on:
      - db

  # 4. Modul 3 (AI Assistant)
  modul3_assistant:
    build: ./modul3
    container_name: fastapi_modul3
    platform: linux/amd64
    restart: always
    ports:
      - "8002:8002"
    environment:
      DATABASE_URL: postgresql://postgres:root@db:5432/llm_chat_db
      LLM_PROVIDER: "gemini"
      LLM_MODEL: "gemini-2.5-flash"
      GEMINI_API_KEY: "${GEMINI_API_KEY}"
    depends_on:
      - db

volumes:
  postgres_data:
