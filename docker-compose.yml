version: "3.8"

services:
  # 1. Database PostgreSQL
  db:
    image: postgres:15
    container_name: postgres_db_main
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: llm_chat_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 2. Modul 1 (CRUD & Database)
  modul1_api:
    build: ./modul1
    container_name: fastapi_modul1
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:root@db:5432/llm_chat_db
    depends_on:
      - db

  # 3. Modul 2 (LLM / Gemini)
  modul2_llm:
    build: ./modul2
    container_name: fastapi_modul2
    ports:
      - "8001:8001"
    environment:
      GEMINI_API_KEY: "AIzaSyCayRXUib939hMplPTncMvS2bBp_RPVtGI"
    depends_on:
      - db

volumes:
  postgres_data:
