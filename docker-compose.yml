services:
  db:
    image: postgres:15-alpine
    container_name: postgres_db
    platform: linux/amd64
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: llm_chat_db
    ports:
      - "5435:5432"  # Changed to 5435 to avoid ANY conflict with fire_bender
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: .
    container_name: fastapi_app
    platform: linux/amd64
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgresql://postgres:root@db:5432/llm_chat_db

volumes:
  postgres_data: